<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-label="Five attack strategies on a rising axis of increasing complexity: baseline, system prompt override, augmentation, translation, tree of attacks with pruning">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700&amp;family=Red+Hat+Mono:wght@400&amp;display=swap');
    .title { font-family: 'Red Hat Display', 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #ffffff; }
    .sub { font-family: 'Red Hat Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #9a98c8; }
    .axis-label { font-family: 'Red Hat Display', 'Segoe UI', Arial, sans-serif; font-size: 18px; font-style: italic; font-weight: 600; fill: #34bdbd; }
  </style>

  <defs>
    <linearGradient id="axis" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ee0000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ee0000"/>
    </linearGradient>
  </defs>

  <!-- rising axis -->
  <line x1="48" y1="402" x2="1033" y2="66.5" stroke="url(#axis)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="1048,61.4 1035.1,73.2 1030.5,60.0" fill="#ee0000"/>
  <circle cx="48" cy="402" r="4" fill="#0d0c26" stroke="#ee0000" stroke-width="2"/>

  <text class="axis-label" transform="translate(548 262) rotate(-18.85)">increasing complexity</text>

  <!-- 01 baseline -->
  <line x1="141" y1="344.2" x2="141" y2="370.2" stroke="#3a3488" stroke-width="1.5" stroke-dasharray="2 3"/>
  <rect x="50" y="286.2" width="182" height="58" rx="9" fill="#1a1654" stroke="#2e2880"/>
  <rect x="64" y="296.2" width="3" height="38" rx="1.5" fill="#8a88bb"/>
  <text class="title" x="80" y="312.2">Baseline</text>
  <text class="sub" x="80" y="330.2">prompt as sent</text>

  <!-- 02 SPO -->
  <line x1="341" y1="276" x2="341" y2="302" stroke="#3a3488" stroke-width="1.5" stroke-dasharray="2 3"/>
  <rect x="250" y="218" width="182" height="58" rx="9" fill="#1a1654" stroke="#2e2880"/>
  <rect x="264" y="228" width="3" height="38" rx="1.5" fill="#4a86e8"/>
  <text class="title" x="280" y="244">SPO</text>
  <text class="sub" x="280" y="262">system prompt override</text>

  <!-- 03 augmentation -->
  <line x1="541" y1="207.7" x2="541" y2="233.7" stroke="#3a3488" stroke-width="1.5" stroke-dasharray="2 3"/>
  <rect x="450" y="149.7" width="182" height="58" rx="9" fill="#1a1654" stroke="#2e2880"/>
  <rect x="464" y="159.7" width="3" height="38" rx="1.5" fill="#f0ab00"/>
  <text class="title" x="480" y="175.7">Augmentation</text>
  <text class="sub" x="480" y="193.7">evasive edits</text>

  <!-- 04 translation -->
  <line x1="741" y1="139.4" x2="741" y2="165.4" stroke="#3a3488" stroke-width="1.5" stroke-dasharray="2 3"/>
  <rect x="650" y="81.4" width="182" height="58" rx="9" fill="#1a1654" stroke="#2e2880"/>
  <rect x="664" y="91.4" width="3" height="38" rx="1.5" fill="#b18cff"/>
  <text class="title" x="680" y="107.4">Translation</text>
  <text class="sub" x="680" y="125.4">other language</text>

  <!-- 05 TAP -->
  <line x1="941" y1="71.1" x2="941" y2="97.1" stroke="#3a3488" stroke-width="1.5" stroke-dasharray="2 3"/>
  <rect x="850" y="13.1" width="182" height="58" rx="9" fill="#1a1654" stroke="#ee0000"/>
  <rect x="864" y="23.1" width="3" height="38" rx="1.5" fill="#ee0000"/>
  <text class="title" x="880" y="39.1">TAP</text>
  <text class="sub" x="880" y="57.1">adaptive tree</text>
</svg>
