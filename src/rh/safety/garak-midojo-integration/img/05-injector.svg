<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title"><title id="title">The Probe resolves and activates an Injector with a declarative InjectionPlan. The Generator communicates with the target agent.</title><defs>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#78adff"/></marker>
<marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ff7e8b"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#6ed6ac"/></marker>
<marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#c8adff"/></marker>
<marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ffc15a"/></marker>
<marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#aaa8cc"/></marker>
<marker id="white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#f5f3ff"/></marker>
</defs><style>text{font-family:"Red Hat Text","Segoe UI",Arial,sans-serif}.mono{font-family:"Red Hat Mono",Menlo,monospace}</style>
<rect x="20" y="80" width="230" height="96" rx="12" fill="#15122f" stroke="#78adff" stroke-width="2"/>
<text x="38" y="113" fill="#78adff" font-size="22" text-anchor="start">Probe</text>
<text x="38" y="144" fill="#f5f3ff" font-size="18" text-anchor="start">Benign task + attack goal</text>
<rect x="420" y="80" width="230" height="96" rx="12" fill="#15122f" stroke="#78adff" stroke-width="2"/>
<text x="438" y="113" fill="#78adff" font-size="22" text-anchor="start">Generator</text>
<text x="438" y="144" fill="#f5f3ff" font-size="18" text-anchor="start">Target access</text>
<rect x="885" y="80" width="215" height="96" rx="12" fill="#15122f" stroke="#6ed6ac" stroke-width="2"/>
<text x="903" y="113" fill="#6ed6ac" font-size="22" text-anchor="start">Agent</text>
<text x="903" y="144" fill="#f5f3ff" font-size="18" text-anchor="start">Trusted user task</text>
<path d="M420 100 V25 H135 V80" fill="none" stroke="#78adff" stroke-width="2" marker-end="url(#blue)"/>
<text x="280" y="19" fill="#78adff" font-size="18" text-anchor="middle">capabilities</text>
<path d="M250 128 H420" fill="none" stroke="#78adff" stroke-width="2" marker-end="url(#blue)"/>
<text x="335" y="113" fill="#78adff" font-size="18" text-anchor="middle">benign task</text>
<path d="M650 128 H885" fill="none" stroke="#6ed6ac" stroke-width="2" marker-end="url(#green)"/>
<text x="765" y="113" fill="#6ed6ac" font-size="18" text-anchor="middle">generate</text>
<rect x="20" y="280" width="230" height="96" rx="12" fill="#15122f" stroke="#aaa8cc" stroke-width="2"/>
<text x="38" y="313" fill="#aaa8cc" font-size="22" text-anchor="start">InjectorService</text>
<text x="38" y="344" fill="#f5f3ff" font-size="18" text-anchor="start">Configured providers</text>
<path d="M135 176 V280" fill="none" stroke="#aaa8cc" stroke-width="2" marker-end="url(#muted)"/>
<text x="151" y="235" fill="#aaa8cc" font-size="18" text-anchor="start">resolve</text>
<rect x="420" y="280" width="230" height="96" rx="12" fill="#15122f" stroke="#ff7e8b" stroke-width="2"/>
<text x="438" y="313" fill="#ff7e8b" font-size="22" text-anchor="start">Injector</text>
<text x="438" y="344" fill="#f5f3ff" font-size="18" text-anchor="start">Apply InjectionPlan</text>
<path d="M250 328 H420" fill="none" stroke="#aaa8cc" stroke-width="2" marker-end="url(#muted)"/>
<text x="335" y="313" fill="#aaa8cc" font-size="18" text-anchor="middle">select</text>
<path d="M220 176 V225 H535 V280" fill="none" stroke="#ff7e8b" stroke-width="2" marker-end="url(#red)"/>
<text x="380" y="212" fill="#ff7e8b" font-size="18" text-anchor="middle">activate(plan)</text>
<rect x="820" y="280" width="280" height="96" rx="12" fill="#15122f" stroke="#ff7e8b" stroke-width="2"/>
<text x="838" y="313" fill="#ff7e8b" font-size="22" text-anchor="start">Untrusted surface</text>
<text x="838" y="344" fill="#f5f3ff" font-size="18" text-anchor="start">Tool result / workspace file</text>
<path d="M650 328 H820" fill="none" stroke="#ff7e8b" stroke-width="2" marker-end="url(#red)"/>
<text x="735" y="313" fill="#ff7e8b" font-size="18" text-anchor="middle">payload</text>
<path d="M993 280 V176" fill="none" stroke="#ff7e8b" stroke-width="2" marker-end="url(#red)"/>
<text x="1009" y="235" fill="#ff7e8b" font-size="18" text-anchor="start">read</text>
<text x="560" y="425" fill="#ff7e8b" font-size="20" text-anchor="middle">FakeMCP  ·  LocalFile  ·  OpenShellFile</text>
</svg>
