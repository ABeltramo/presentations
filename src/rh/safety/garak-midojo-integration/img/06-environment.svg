<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title"><title id="title">The Probe controls setup and teardown of an optional Environment that supplies scoped isolation and observation.</title><defs>
