name: Build & notify site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build slides
        run: |
          npm ci
          npm run build

      # abeltra.me serves /presentations/ from its own Hugo deploy,
      # which checks out this repo and rebuilds the decks itself.
      # A push here only needs to tell that site to rebuild.
      # SITE_TRIGGER_TOKEN: a PAT with "contents: write" on
      # ABeltramo/abeltramo.github.io (events from the default
      # GITHUB_TOKEN do not trigger other workflows).
      - name: Notify abeltra.me
        if: ${{ secrets.SITE_TRIGGER_TOKEN != '' }}
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_TRIGGER_TOKEN }}" \
            https://api.github.com/repos/ABeltramo/abeltramo.github.io/dispatches \
            -d '{"event_type":"presentations-updated"}'
